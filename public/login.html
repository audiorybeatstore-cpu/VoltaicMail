<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltaicMail — Control Plane Access</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --surface-raised: #141414;
            --border: #262626;
            --border-focus: #404040;
            --text: #ffffff;
            --text-muted: #a3a3a3;
            --text-dim: #737373;
            --accent: #ffffff;
            --accent-dim: #e5e5e5;
            --error: #f43f5e;
            --error-bg: #110c0e;
            --success: #10b981;
            --success-bg: #06120e;
        }

        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .auth-container { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            padding: 40px; 
            border-radius: 0px; 
            width: 100%; 
            max-width: 420px; 
            box-sizing: border-box; 
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            stroke: var(--text);
            margin-bottom: 12px;
        }

        .brand-header h1 {
            font-size: 18px;
            font-weight: 500;
            margin: 0;
            letter-spacing: -0.025em;
        }

        .brand-header p {
            font-size: 13px;
            color: var(--text-dim);
            margin: 4px 0 0 0;
        }

        .tabs { 
            display: flex; 
            border-bottom: 1px solid var(--border); 
            margin-bottom: 28px; 
        }

        .tab-btn { 
            flex: 1; 
            padding: 10px; 
            text-align: center; 
            cursor: pointer; 
            color: var(--text-dim); 
            font-size: 13px;
            font-weight: 500; 
            border-bottom: 1px solid transparent; 
            transition: all 0.15s ease;
            margin-bottom: -1px;
        }

        .tab-btn:hover {
            color: var(--text-muted);
        }

        .tab-btn.active { 
            color: var(--text); 
            border-bottom: 1px solid var(--text); 
        }

        .form-group { 
            margin-bottom: 20px; 
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label { 
            font-size: 12px; 
            color: var(--text-muted); 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500; 
        }

        .forgot-link {
            font-size: 12px;
            color: var(--text-dim);
            text-decoration: none;
            cursor: pointer;
        }

        .forgot-link:hover {
            color: var(--text);
        }

        input { 
            width: 100%; 
            background: var(--surface-raised); 
            border: 1px solid var(--border); 
            padding: 12px 14px; 
            border-radius: 0px; 
            color: var(--text); 
            font-size: 14px; 
            box-sizing: border-box; 
            outline: none; 
            transition: border-color 0.1s ease; 
        }

        input:focus { 
            border-color: var(--border-focus); 
        }

        .password-wrapper { 
            position: relative; 
            display: flex; 
            align-items: center; 
        }

        .password-wrapper input {
            padding-right: 44px;
        }

        .toggle-password { 
            position: absolute; 
            right: 0;
            top: 0;
            bottom: 0;
            width: 44px;
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: var(--text-dim); 
            background: none; 
            border: none; 
            padding: 0; 
        }

        .toggle-password:hover { 
            color: var(--text-muted); 
        }

        .toggle-password svg { 
            width: 16px; 
            height: 16px; 
            fill: none; 
            stroke: currentColor; 
            stroke-width: 2; 
            stroke-linecap: round; 
            stroke-linejoin: round; 
        }

        button.submit-btn { 
            width: 100%; 
            background: var(--accent); 
            color: var(--bg); 
            border: 1px solid var(--accent); 
            padding: 12px; 
            border-radius: 0px; 
            font-size: 14px; 
            font-weight: 500; 
            cursor: pointer; 
            transition: all 0.1s ease; 
            margin-top: 8px; 
        }

        button.submit-btn:hover { 
            background: var(--bg);
            color: var(--text);
            border-color: var(--border-focus);
        }

        .msg { 
            margin-top: 20px; 
            font-size: 13px; 
            line-height: 1.5; 
            padding: 12px; 
            border-radius: 0px; 
            display: none; 
        }

        .msg-success { 
            color: var(--success); 
            background: var(--success-bg); 
            border: 1px solid rgba(16, 185, 129, 0.15); 
        }

        .msg-error { 
            color: var(--error); 
            background: var(--error-bg); 
            border: 1px solid rgba(244, 63, 94, 0.15); 
        }

        .verification-card { 
            background: var(--surface-raised); 
            border: 1px solid var(--border); 
            padding: 14px; 
            margin-top: 20px; 
            text-align: left; 
        }

        .verification-card p { 
            margin: 0 0 8px 0; 
            font-size: 12px; 
            color: var(--text-muted); 
        }

        .verification-card a { 
            color: var(--text); 
            font-weight: 500; 
            text-decoration: underline; 
            word-break: break-all; 
            font-family: monospace; 
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-header">
            <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            <h1 id="brandTitle">VoltaicMail</h1>
            <p id="brandSubtitle">Delivery Engine Infrastructure</p>
        </div>

        <div class="tabs" id="authTabs">
            <div class="tab-btn active" id="loginTab" onclick="switchAuthMode('login')">Sign In</div>
            <div class="tab-btn" id="signupTab" onclick="switchAuthMode('signup')">Create Account</div>
        </div>

        <form id="authForm" onsubmit="handleAuthSubmit(event)">
            <div class="form-group" id="emailGroup">
                <div class="label-row">
                    <label for="email">Email Address</label>
                    <a class="forgot-link" id="forgotLink" onclick="switchAuthMode('forgot')">Forgot?</a>
                </div>
                <input type="email" id="email" placeholder="name@domain.com">
            </div>

            <div class="form-group" id="passwordGroup">
                <div class="label-row">
                    <label id="passwordLabel" for="password">Password</label>
                </div>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Toggle password view state">
                        <svg id="eyeIcon" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Authenticate</button>
        </form>

        <div id="feedbackMsg" class="msg"></div>
        <div id="verifyBlock" style="display: none;"></div>
    </div>

    <script>
        let currentMode = 'login';
        let resetToken = null;

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            if (token) {
                resetToken = token;
                switchAuthMode('reset');
            }
        });

        function switchAuthMode(mode) {
            currentMode = mode;
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const authTabs = document.getElementById('authTabs');
            const emailGroup = document.getElementById('emailGroup');
            const passwordGroup = document.getElementById('passwordGroup');
            const passwordLabel = document.getElementById('passwordLabel');
            const forgotLink = document.getElementById('forgotLink');
            const submitBtn = document.getElementById('submitBtn');
            const brandTitle = document.getElementById('brandTitle');
            const brandSubtitle = document.getElementById('brandSubtitle');
            
            document.getElementById('feedbackMsg').style.display = 'none';
            document.getElementById('verifyBlock').style.display = 'none';

            // Reset generic input requirements
            document.getElementById('email').required = false;
            document.getElementById('password').required = false;

            if (mode === 'login' || mode === 'signup') {
                authTabs.style.display = 'flex';
                emailGroup.style.display = 'block';
                passwordGroup.style.display = 'block';
                forgotLink.style.display = 'block';
                passwordLabel.innerText = 'Password';
                brandTitle.innerText = 'VoltaicMail';
                brandSubtitle.innerText = 'Delivery Engine Infrastructure';
                
                document.getElementById('email').required = true;
                document.getElementById('password').required = true;

                loginTab.classList.toggle('active', mode === 'login');
                signupTab.classList.toggle('active', mode === 'signup');
                submitBtn.innerText = mode === 'login' ? 'Authenticate' : 'Provision Instance';
            } else if (mode === 'forgot') {
                authTabs.style.display = 'none';
                emailGroup.style.display = 'block';
                passwordGroup.style.display = 'none';
                brandTitle.innerText = 'Recover Account';
                brandSubtitle.innerText = 'Request security verification link';
                
                document.getElementById('email').required = true;
                submitBtn.innerText = 'Issue Reset Instructions';
            } else if (mode === 'reset') {
                authTabs.style.display = 'none';
                emailGroup.style.display = 'none';
                passwordGroup.style.display = 'block';
                passwordLabel.innerText = 'New Secure Password';
                brandTitle.innerText = 'Update Password';
                brandSubtitle.innerText = 'Re-establishing access security layer';
                
                document.getElementById('password').required = true;
                submitBtn.innerText = 'Save Changes';
            }
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }

        async function handleAuthSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('feedbackMsg');
            const verifyBlock = document.getElementById('verifyBlock');
            
            msg.style.display = 'none';
            verifyBlock.style.display = 'none';

            let endpoint = '/api/auth/login';
            let payload = { email, password };

            if (currentMode === 'signup') {
                endpoint = '/api/auth/signup';
            } else if (currentMode === 'forgot') {
                endpoint = '/api/auth/forgot-password';
                payload = { email };
            } else if (currentMode === 'reset') {
                endpoint = '/api/auth/reset-password';
                payload = { token: resetToken, newPassword: password };
            }

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Pipeline execution failure.');

                if (currentMode === 'signup') {
                    msg.className = 'msg msg-success';
                    msg.innerText = 'Identity registered. Activation token generated below.';
                    msg.style.display = 'block';

                    verifyBlock.className = 'verification-card';
                    verifyBlock.innerHTML = `
                        <p><strong>Sandbox Simulator Pipeline:</strong> Click to mock automated registration link safely:</p>
                        <a href="${data.link}" target="_blank">${window.location.origin}${data.link}</a>
                    `;
                    verifyBlock.style.display = 'block';
                } else if (currentMode === 'forgot') {
                    msg.className = 'msg msg-success';
                    msg.innerText = data.message;
                    msg.style.display = 'block';

                    if (data.link) {
                        verifyBlock.className = 'verification-card';
                        verifyBlock.innerHTML = `
                            <p><strong>Sandbox Simulator Pipeline:</strong> Recovery token compiled:</p>
                            <a href="${data.link}">${window.location.origin}${data.link}</a>
                        `;
                        verifyBlock.style.display = 'block';
                    }
                } else if (currentMode === 'reset') {
                    msg.className = 'msg msg-success';
                    msg.innerText = 'Credentials updated. Redirecting to initialization...';
                    msg.style.display = 'block';
                    setTimeout(() => { switchAuthMode('login'); }, 1500);
                } else {
                    msg.className = 'msg msg-success';
                    msg.innerText = 'Authorized. Constructing active control panel context...';
                    msg.style.display = 'block';
                    setTimeout(() => { window.location.href = '/index.html'; }, 800);
                }
            } catch (err) {
                msg.className = 'msg msg-error';
                msg.innerText = err.message;
                msg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
