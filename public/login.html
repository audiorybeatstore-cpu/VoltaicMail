<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltaicMail - Access Management</title>
    <style>
        body { background: #060913; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-container { background: #0b1120; border: 1px solid #1e293b; padding: 40px; border-radius: 12px; width: 100%; max-width: 420px; box-sizing: border-box; }
        .tabs { display: flex; border-bottom: 1px solid #1e293b; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; cursor: pointer; color: #64748b; font-weight: 600; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #3b82f6; border-color: #3b82f6; }
        .form-group { margin-bottom: 20px; position: relative; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; font-weight: 500; }
        input { width: 100%; background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 8px; color: #ffffff; font-size: 15px; box-sizing: border-box; outline: none; transition: border 0.15s; }
        input:focus { border-color: #3b82f6; }
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .toggle-password { position: absolute; right: 14px; cursor: pointer; display: flex; align-items: center; color: #64748b; }
        .toggle-password:hover { color: #94a3b8; }
        .toggle-password svg { width: 20px; height: 20px; }
        button { width: 100%; background: #2563eb; color: #ffffff; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.15s; margin-top: 10px; }
        button:hover { background: #1d4ed8; }
        .msg { margin-top: 15px; font-size: 14px; text-align: center; line-height: 1.5; }
        .msg-success { color: #10b981; }
        .msg-error { color: #ef4444; }
        .verify-link-wrapper { background: #15213d; border: 1px solid #1e3a8a; padding: 12px; border-radius: 6px; margin-top: 15px; word-break: break-all; text-align: left; }
        .verify-link-wrapper a { color: #60a5fa; font-weight: 600; text-decoration: none; }
        .verify-link-wrapper a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="tabs">
            <div class="tab-btn active" id="loginTab" onclick="switchAuthMode('login')">Sign In</div>
            <div class="tab-btn" id="signupTab" onclick="switchAuthMode('signup')">Create Account</div>
        </div>

        <form id="authForm" onsubmit="handleAuthSubmit(event)">
            <div class="form-group">
                <label for="email">Workspace Email</label>
                <input type="email" id="email" required placeholder="name@company.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" required placeholder="••••••••">
                    <span class="toggle-password" onclick="togglePasswordVisibility('password')">
                        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
            </div>

            <button type="submit" id="submitBtn">Authenticate</button>
        </form>

        <div id="feedbackMsg" class="msg"></div>
    </div>

    <script>
        let currentMode = 'login';

        function switchAuthMode(mode) {
            currentMode = mode;
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const submitBtn = document.getElementById('submitBtn');
            const feedbackMsg = document.getElementById('feedbackMsg');
            
            feedbackMsg.innerHTML = '';
            
            if (mode === 'login') {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                submitBtn.innerText = 'Authenticate';
            } else {
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
                submitBtn.innerText = 'Register Platform Instance';
            }
        }

        function togglePasswordVisibility(fieldId) {
            const input = document.getElementById(fieldId);
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (input.type === 'password') {
                input.type = 'text';
                eyeIcon.innerHTML = `
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                    <path d="M9 9a3 3 0 1 1-4.24-4.24"></path>
                    <path d="M12 5c.67 0 1.35.09 2 .26M17.61 5.61A10.29 10.29 0 0 1 23 12s-4 8-11 8c-1.66 0-3.2-.37-4.59-1M3.61 11.39A10.24 10.24 0 0 1 1 12s4-8 11-8"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            } else {
                input.type = 'password';
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }

        async function handleAuthSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const feedbackMsg = document.getElementById('feedbackMsg');
            
            feedbackMsg.innerHTML = '';

            if (currentMode === 'signup') {
                try {
                    const res = await fetch('/api/auth/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();
                    
                    if (!res.ok) throw new Error(data.error || 'Registration failed.');
                    
                    feedbackMsg.className = 'msg msg-success';
                    feedbackMsg.innerHTML = `
                        <div>Registration complete. Please simulate email validation by clicking the active token link below:</div>
                        <div class="verify-link-wrapper">
                            <a href="${data.verifyLink}" target="_blank">Verify Account Framework</a>
                        </div>
                    `;
                } catch (err) {
                    feedbackMsg.className = 'msg msg-error';
                    feedbackMsg.innerText = err.message;
                }
            } else {
                feedbackMsg.className = 'msg msg-success';
                feedbackMsg.innerText = 'Authentication successful! Loading workspace...';
                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 1000);
            }
        }
    </script>
</body>
</html>
